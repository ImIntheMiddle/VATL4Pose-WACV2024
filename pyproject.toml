[project]
name = "vatl4pose"
version = "1.0.0.dev0"
description = "Video-specific Active Transfer Learning for human pose estimation (WACV 2024), refactored."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<2.3",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "opencv-python-headless>=4.10",
  "h5py>=3.11",
  "pycocotools>=2.0.8",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3",
  "tqdm>=4.66",
  "optuna>=4.0",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
cpu = ["torch==2.6.0", "torchvision==0.21.0"]
cu124 = ["torch==2.6.0", "torchvision==0.21.0"]
cu128 = ["torch==2.7.1", "torchvision==0.22.1"]
wandb = ["wandb>=0.18"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vatl4pose", "third_party"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu124" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
  { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
