[project]
name = "vatl4pose"
version = "1.0.0"
description = "Video-specific Active Transfer Learning for human pose estimation (WACV 2024)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=1.26,<2.3",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "opencv-python-headless>=4.10,<5",
  "h5py>=3.11",
  "pycocotools>=2.0.8",
  "hydra-core>=1.3.2",
  "omegaconf>=2.3",
  "matplotlib>=3.9",
  "pillow>=10.0",
  "threadpoolctl>=3.1",
]

[project.optional-dependencies]
cpu = ["torch==2.6.0", "torchvision==0.21.0"]
cu124 = ["torch==2.6.0", "torchvision==0.21.0"]
cu128 = ["torch==2.7.1", "torchvision==0.22.1"]
wandb = ["wandb>=0.18"]
explain = ["imageio-ffmpeg>=0.5"]

[project.scripts]
vatl4pose = "vatl4pose.cli.execution:main"
vatl4pose-download-weights = "vatl4pose.cli.download_weights:main"
vatl4pose-doctor = "vatl4pose.cli.doctor:main"
vatl4pose-prepare-annotations = "vatl4pose.cli.prepare_annotations:main"
vatl4pose-prepare = "vatl4pose.cli.prepare:main"
vatl4pose-train = "vatl4pose.cli.train:main"
vatl4pose-eval = "vatl4pose.cli.evaluate:main"
vatl4pose-atl = "vatl4pose.cli.atl:main"
vatl4pose-tune = "vatl4pose.cli.tune:main"
vatl4pose-summarize = "vatl4pose.cli.summarize:main"
vatl4pose-explain = "vatl4pose.explain.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vatl4pose", "third_party"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu124" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
  { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu124", extra = "cu124" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
