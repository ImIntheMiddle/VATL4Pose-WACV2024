# @package _global_
# WACV 2024, JRDB-Pose (paper Table 4): FastPose on the 15 test videos.
# Run with `strategy=<name>`; the proposed method is `strategy=thc_wpu_duw` (the default).
defaults:
  - override /dataset: jrdb_pose
  - override /estimator: fastpose

run:
  name: wacv2024_jrdb

dataset:
  split: test
  ids_file: ${splits:jrdb_pose_test.txt}

estimator:
  weights: jrdb/fastpose_256x192.pth

ae:
  checkpoint: wholebodyAE/JRDB2022/Hybrid/WholeBodyAE_zdim4_v1.pth

# weight of the uncertainty term of the DUW selector (strategy.params.lam of the DUW strategies)
lam: 1000.0

retrain:
  batch_size: 32

# `vatl4pose-tune`: the 2 validation videos of JRDB-Pose
tune:
  split: val
  ids_file: ${splits:jrdb_pose_val.txt}
