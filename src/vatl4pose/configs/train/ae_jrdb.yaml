# @package _global_
# Pretraining of the whole-body autoencoder on JRDB-Pose: the recipe of ae_posetrack21 on the
# 10 training and 2 validation videos (paper: 10 and 2 videos). The features are standardised and
# the loss is a masked MSE (invisible joints are left out).
# Batch size: chosen by the validation loss (masked MSE in standardised space, seed 166, CPU) among
# 256, 1000 and 10000, which gave 1.1720 (stopped at epoch 55, best epoch 25), 1.2046 (best epoch 300)
# and 2.2694 (best epoch 300). The 12088 training people make 2 updates per epoch at 10000. The
# validation videos have a larger spread than the training ones: the constant output 0 (the training
# mean) scores 2.341 on them, against 1.0 on the training split. The shipped run (256, 4 CPU threads
# instead of the 2 of the comparison) reached 1.1687 at epoch 25 and stopped at epoch 55. A run is
# reproducible byte for byte with the same number of CPU threads and differs a little with another.
defaults:
  - override /dataset: jrdb_pose

run:
  name: ae_jrdb

train:
  target: ae
  train_split: train
  train_ids_file: ${splits:jrdb_pose_train.txt}
  val_split: val
  val_ids_file: ${splits:jrdb_pose_val.txt}
  ae:
    z_dim: 4
    lr: 1.0e-3
    lr_steps:
      - {epoch: 12, lr: 2.0e-4}
      - {epoch: 40, lr: 5.0e-5}
    epochs: 300
    batch_size: 256
    patience: 30
