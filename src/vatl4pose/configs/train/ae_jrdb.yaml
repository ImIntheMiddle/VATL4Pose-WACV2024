# @package _global_
# Pretraining of the whole-body autoencoder on JRDB-Pose: the recipe of ae_posetrack21 on the
# 10 training and 2 validation videos (paper: 10 and 2 videos). The features are standardized, the
# loss is a masked MSE (invisible joints are left out), and the joints of a person on the seam of
# the 360-degree frame are placed next to the person (dataset.panorama of jrdb_pose.yaml).
# Epochs: at most 1000, stopped by patience 30 (the shipped run stopped at epoch 178, best epoch
# 148). Batch size 256 gave the lower validation loss (masked MSE in standardized space, seed 166,
# CPU, 4 threads) than 1000: 1.5901 against 1.6347. A run is reproducible byte for byte with the
# same number of CPU threads and differs a little with another.
defaults:
  - override /dataset: jrdb_pose

run:
  name: ae_jrdb

train:
  target: ae
  train_split: train
  train_ids_file: ${splits:jrdb_pose_train.txt}
  val_split: val
  val_ids_file: ${splits:jrdb_pose_val.txt}
  ae:
    z_dim: 4
    lr: 1.0e-3
    lr_steps:
      - {epoch: 12, lr: 2.0e-4}
      - {epoch: 40, lr: 5.0e-5}
    epochs: 1000
    batch_size: 256
    patience: 30
