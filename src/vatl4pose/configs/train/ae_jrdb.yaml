# @package _global_
# Pretraining of the whole-body autoencoder on JRDB-Pose (spec 13.3): the recipe of ae_posetrack21 on the
# 10 training and 2 validation videos (paper: 10 and 2 videos).
defaults:
  - override /dataset: jrdb_pose

run:
  name: ae_jrdb

train:
  target: ae
  train_split: train
  train_ids_file: ${splits:jrdb_pose_train.txt}
  val_split: val
  val_ids_file: ${splits:jrdb_pose_val.txt}
  ae:
    z_dim: 4
    lr: 1.0e-3
    lr_steps:
      - {epoch: 12, lr: 2.0e-4}
      - {epoch: 40, lr: 5.0e-5}
    epochs: 300
    batch_size: 10000
    patience: 30
