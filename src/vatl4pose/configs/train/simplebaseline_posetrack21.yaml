# @package _global_
# Initial training of SimpleBaseline on PoseTrack21.
# Paper: Adam, lr 1e-3, early stopping at epoch 62. Here: batch 180, 200 epochs, Adam, lr 1e-3 with
# factor 0.1 at epochs 90 and 120.
# The best epoch is chosen by the validation AP.
defaults:
  - override /dataset: posetrack21
  - override /estimator: simplebaseline

run:
  name: simplebaseline_posetrack21

# the ImageNet ResNet-50 backbone and a head with normal(0, 0.001) weights
estimator:
  weights: null
  imagenet_init: true

train:
  target: estimator
  train_split: train
  train_ids_file: ${splits:posetrack21_train.txt}
  val_split: train_val
  val_ids_file: ${splits:posetrack21_train_val.txt}
  lr: 1.0e-3
  milestones: [90, 120]
  epochs: 200
  batch_size: 180
