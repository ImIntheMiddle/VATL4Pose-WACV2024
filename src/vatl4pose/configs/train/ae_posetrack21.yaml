# @package _global_
# Pretraining of the whole-body autoencoder on PoseTrack21. Paper: Adam, lr 1e-3, 300 epochs.
# Here: AdamW, lr 1e-3 with steps at epochs 12 (2e-4) and 40 (5e-5).
# The features are standardized and the loss is a masked MSE (invisible joints are left out).
# Epochs: at most 1000, stopped by patience 30. A run is reproducible byte for byte with the
# same number of CPU threads and differs a little with another.
defaults:
  - override /dataset: posetrack21

run:
  name: ae_posetrack21

train:
  target: ae
  train_split: train
  train_ids_file: ${splits:posetrack21_train.txt}
  val_split: train_val
  val_ids_file: ${splits:posetrack21_train_val.txt}
  ae:
    z_dim: 4
    lr: 1.0e-3
    lr_steps:
      - {epoch: 12, lr: 2.0e-4}
      - {epoch: 40, lr: 5.0e-5}
    epochs: 1000
    batch_size: 256
    patience: 30
