# @package _global_
# Training of FastPose on JRDB-Pose, starting from the FastPose retrained on PoseTrack21
# (run `train=fastpose_posetrack21` first). Paper: 10 training videos, lr 5e-4, 40 epochs.
# 2023 configs/jrdb-pose/fastpose_jrdb22.yaml: batch 240 on 2 GPUs = 480, lr 5e-4, LR_STEP 90, 120
# (never reached in 40 epochs).
defaults:
  - override /dataset: jrdb_pose
  - override /estimator: fastpose

run:
  name: fastpose_jrdb

estimator:
  weights: null

train:
  target: estimator
  train_split: train
  train_ids_file: ${splits:jrdb_pose_train.txt}
  val_split: val
  val_ids_file: ${splits:jrdb_pose_val.txt}
  init_weights: ${abspath:${paths.output_root}/train/fastpose_posetrack21/best.pth}
  lr: 5.0e-4
  milestones: [90, 120]
  epochs: 40
  batch_size: 480
